[package]
name = "option-core"
version = "0.1.0"
edition = "2021"
description = "Option pricing engine and Greeks calculator for Investment OS"
license = "AGPL-3.0"
authors = ["AlphaForge Team"]

[dependencies]
# Domain models
domain = { path = "../domain" }

# Numerical computing
statrs = "0.17"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Stable identifiers shared with the domain models
uuid.workspace = true

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Async runtime for providers
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"

# Logging
tracing = "0.1"

# Parallel computation
rayon = "1.10"

[dev-dependencies]
# Testing
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "bench"
harness = false

[features]
default = []
live-providers = []
