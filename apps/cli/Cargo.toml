[package]
name = "alphaforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the AlphaForge research workspace"

[lib]
name = "alphaforge_cli"
path = "src/lib.rs"

[[bin]]
name = "alphaforge"
path = "src/main.rs"

[dependencies]
alpha-forge = { path = "../desktop/src-tauri" }
domain = { path = "../../crates/domain" }
provider-core = { path = "../../crates/provider-core" }

clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
async-trait = "0.1"
chrono.workspace = true
tempfile = "3"
