<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="AlphaForge Core Product Loop">
  <defs>
    <marker id="loop-arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="760" height="440" rx="12" fill="#0d1117"/>

  <!-- Dashed circle path -->
  <circle cx="380" cy="220" r="130" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Nodes -->
  <!-- 1. Information (top) -->
  <circle cx="380" cy="90" r="44" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="380" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#58a6ff">Information</text>
  <text x="380" y="102" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="18">📊</text>

  <!-- 2. Knowledge (top-right) -->
  <circle cx="482" cy="139" r="44" fill="#161b22" stroke="#388bfd" stroke-width="2.5"/>
  <text x="482" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#388bfd">Knowledge</text>
  <text x="482" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="18">💡</text>

  <!-- 3. Thesis (right) -->
  <circle cx="507" cy="249" r="44" fill="#161b22" stroke="#2f81f7" stroke-width="2.5"/>
  <text x="507" y="245" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2f81f7">Thesis</text>
  <text x="507" y="261" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="18">📝</text>

  <!-- 4. Decision (bottom-right) -->
  <circle cx="437" cy="337" r="44" fill="#161b22" stroke="#39c5cf" stroke-width="2.5"/>
  <text x="437" y="333" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#39c5cf">Decision</text>
  <text x="437" y="349" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="18">✅</text>

  <!-- 5. Validation (bottom-left) -->
  <circle cx="324" cy="337" r="44" fill="#161b22" stroke="#39c5cf" stroke-width="2.5"/>
  <text x="324" y="333" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#39c5cf">Validation</text>
  <text x="324" y="349" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="18">🔍</text>

  <!-- 6. Review (left) -->
  <circle cx="253" cy="249" r="44" fill="#161b22" stroke="#2f81f7" stroke-width="2.5"/>
  <text x="253" y="245" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2f81f7">Review</text>
  <text x="253" y="261" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="18">📋</text>

  <!-- 7. Improvement (top-left) -->
  <circle cx="278" cy="139" r="44" fill="#161b22" stroke="#388bfd" stroke-width="2.5"/>
  <text x="278" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#388bfd">Improvement</text>
  <text x="278" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="18">🔄</text>

  <!-- Directional arrows (small, on the circle between nodes) -->
  <path d="M 422,99 A 130,130 0 0,1 470,121" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#loop-arrow-d)"/>
  <path d="M 521,154 A 130,130 0 0,1 524,234" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#loop-arrow-d)"/>
  <path d="M 503,292 A 130,130 0 0,1 474,323" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#loop-arrow-d)"/>
  <path d="M 397,348 A 130,130 0 0,1 363,348" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#loop-arrow-d)"/>
  <path d="M 286,323 A 130,130 0 0,1 257,292" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#loop-arrow-d)"/>
  <path d="M 236,234 A 130,130 0 0,1 239,154" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#loop-arrow-d)"/>
  <path d="M 290,121 A 130,130 0 0,1 338,99" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#loop-arrow-d)"/>

  <!-- Center label -->
  <text x="380" y="215" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Core Loop</text>
  <text x="380" y="233" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#8b949e">Continuous improvement</text>
</svg>
