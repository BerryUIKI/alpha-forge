<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="AlphaForge Architecture Overview">
  <defs>
    <marker id="arrow-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0069df"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="420" rx="12" fill="#f6f8fa"/>

  <!-- Tauri Shell Container -->
  <rect x="20" y="20" width="720" height="380" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="380" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0969da">Tauri 2 Desktop Shell</text>

  <!-- React Frontend Box -->
  <rect x="50" y="70" width="300" height="220" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="50" y="70" width="300" height="36" rx="8" fill="#0069df"/>
  <rect x="50" y="94" width="300" height="12" fill="#0069df"/>
  <text x="200" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">React + TypeScript Frontend</text>

  <text x="200" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#656d76">Owns:</text>
  <g font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#1f2328">
    <text x="70" y="150">• Pages &amp; Components</text>
    <text x="70" y="170">• Frontend State &amp; Forms</text>
    <text x="70" y="190">• Charts &amp; Artifact Rendering</text>
    <text x="70" y="210">• Loading / Error / Empty States</text>
    <text x="70" y="230">• Client-side Validation</text>
    <text x="70" y="250">• Unified Desktop API Calls</text>
  </g>
  <text x="200" y="275" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#656d76">React 19 · Vite 6 · Tailwind 4 · shadcn/ui</text>

  <!-- Rust Backend Box -->
  <rect x="410" y="70" width="300" height="220" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="410" y="70" width="300" height="36" rx="8" fill="#0094d9"/>
  <rect x="410" y="94" width="300" height="12" fill="#0094d9"/>
  <text x="560" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Rust Backend</text>

  <text x="560" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#656d76">Owns:</text>
  <g font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#1f2328">
    <text x="430" y="150">• Agent Runtime</text>
    <text x="430" y="170">• SQLite Database Access</text>
    <text x="430" y="190">• Filesystem &amp; Network</text>
    <text x="430" y="210">• Credentials Management</text>
    <text x="430" y="230">• Document / PDF Processing</text>
    <text x="430" y="250">• Permission Enforcement</text>
  </g>
  <text x="560" y="275" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#656d76">Tokio · SQLx · Serde · Tauri Core</text>

  <!-- IPC Arrows -->
  <line x1="350" y1="160" x2="410" y2="160" stroke="#0069df" stroke-width="2" marker-end="url(#arrow-l)"/>
  <line x1="410" y1="200" x2="350" y2="200" stroke="#0069df" stroke-width="2" marker-end="url(#arrow-l)"/>
  <text x="380" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#0069df">IPC</text>

  <!-- SQLite Box -->
  <rect x="290" y="320" width="180" height="56" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="345" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1f2328">SQLite</text>
  <text x="380" y="363" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#656d76">Persistent Storage</text>

  <!-- Connection from Rust to SQLite -->
  <line x1="460" y1="290" x2="400" y2="320" stroke="#0094d9" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-l)"/>
</svg>
