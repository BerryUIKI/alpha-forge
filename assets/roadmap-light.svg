  <text x="40" y="243" font-family="Segoe UI, Helvetica, sans-serif" font-size="10" fill="#656d76">Status reflects the 2026-08-12 integration audit: M2/M3 require stabilization, M8/M9 reopened for local MVP acceptance.</text>
