# PR-Agent Configuration for AlphaForge
# Uses OpenAI-compatible API from api.sfkey.cn

# ====================
# Core Configuration
# ====================
[config]
# Model selection - use gpt-4o for best quality, gpt-4o-mini for speed
model = "gpt-4o"
fallback_models = ["gpt-4o-mini"]

# Git provider
git_provider = "github"

# Output settings
publish_output = true
publish_output_progress = true
verbosity_level = 0

# Token limits
max_description_tokens = 500
max_commits_tokens = 500
max_model_tokens = 128000

# Response language
response_language = "en-US"  # English responses

# AI parameters
temperature = 0.2
seed = -1

# Timeout
ai_timeout = 180  # 3 minutes

# Include repository context files
repo_context_files = ["AGENTS.md"]
repo_context_from_default_branch = true
repo_context_max_lines = 800

# ====================
# GitHub Configuration
# ====================
[github]
deployment_type = "user"
base_url = "https://api.github.com"
publish_inline_comments_fallback_with_verification = true
try_fix_invalid_inline_comments = true
ignore_bot_pr = true

# ====================
# GitHub Actions Auto-trigger
# ====================
[github_action_config]
# Auto-run on PR open
auto_review = true
auto_describe = true
auto_improve = false  # Manual trigger only for improve

# Trigger actions
pr_actions = ["opened", "reopened", "ready_for_review"]

# ====================
# Review Settings
# ====================
[pr_reviewer]
# Enable review features
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
require_security_review = true
require_ticket_analysis_review = true

# Review output
publish_output_no_suggestions = true
persistent_comment = true
num_max_findings = 5

# Review labels
enable_review_labels_security = true
enable_review_labels_effort = true

# Help text
enable_intro_text = true
enable_help_text = false

# ====================
# Description Settings
# ====================
[pr_description]
publish_labels = true
add_original_user_description = true
generate_ai_title = false
use_bullet_points = true
enable_pr_type = true
enable_pr_diagram = true

# Walkthrough
enable_semantic_files_types = true
collapsible_file_list = "adaptive"
collapsible_file_list_threshold = 6

# ====================
# Code Suggestions
# ====================
[pr_code_suggestions]
commitable_code_suggestions = false
focus_only_on_problems = true
max_history_len = 4
publish_output_no_suggestions = true
suggestions_score_threshold = 0

# Extended mode
auto_extended_mode = true
num_code_suggestions_per_chunk = 3
max_number_of_calls = 3
parallel_calls = true

# Self-review checkbox
demand_code_suggestions_self_review = true
code_suggestions_self_review_text = "**Author self-review**: I have reviewed the PR code suggestions and addressed the relevant ones."
approve_pr_on_self_review = false
fold_suggestions_on_self_review = true

# ====================
# Questions Settings
# ====================
[pr_questions]
use_conversation_history = true

# ====================
# Update Changelog
# ====================
[pr_update_changelog]
push_changelog_changes = false
add_pr_link = true
skip_ci_on_push = true

# ====================
# Test Generation
# ====================
[pr_test]
num_tests = 3
avoid_mocks = true

# ====================
# Best Practices
# ====================
[best_practices]
max_lines_allowed = 800
enable_global_best_practices = true

[auto_best_practices]
enable_auto_best_practices = true
utilize_auto_best_practices = true
max_patterns = 5

# ====================
# Artifacts (for CI results)
# ====================
[artifacts]
enable = false
max_artifact_size = 50000